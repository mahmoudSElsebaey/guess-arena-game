name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate Prisma schema
        run: npm run db:validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/guess_arena
          DIRECT_URL: postgresql://ci:ci@localhost:5432/guess_arena
      - name: Generate Prisma Client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/guess_arena
          DIRECT_URL: postgresql://ci:ci@localhost:5432/guess_arena
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:run
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/guess_arena
          DIRECT_URL: postgresql://ci:ci@localhost:5432/guess_arena
          AUTH_SECRET: ci-only-placeholder-secret-for-build
          AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
